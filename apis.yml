name: Outdoor Voices
description: 'Outdoor Voices is an Austin-founded direct-to-consumer activewear and
  athletic apparel brand designing clothing for everyday recreation — running, hiking,
  studio workouts, and rest days — for women and men. The company sells exclusively
  through its own Shopify-hosted e-commerce storefront and retail presence rather
  than a public developer platform. It was surfaced as a portfolio company of GV
  and added to the API Evangelist network. An enrichment pass found no first-party
  public API, SDK, webhook, or developer surface: the site runs on Shopify commerce
  infrastructure with only consumer-facing help, privacy, and terms pages.'
